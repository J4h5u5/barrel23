<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BARREL 23 — Mobile preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
  *{ box-sizing:border-box; }
  body{ margin:0; background:#08080a; color:#f4f1ee; font-family:'Space Mono',monospace;
    min-height:100vh; padding:38px 24px 60px; }
  h1{ font-size:13px; letter-spacing:.3em; color:#6d6a69; font-weight:400; margin:0 0 4px; }
  .sub{ font-size:11px; letter-spacing:.2em; color:#ff2417; margin-bottom:30px; }
  .rail{ display:flex; gap:34px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
  .phone{ width:390px; flex:none; }
  .phone__cap{ font-size:10px; letter-spacing:.26em; color:#6d6a69; text-align:center; margin-bottom:12px; text-transform:uppercase; }
  .device{ width:390px; height:800px; border-radius:44px; background:#000; padding:11px;
    border:1px solid #26262b; box-shadow:0 30px 80px rgba(0,0,0,.6); position:relative; }
  .device::before{ content:""; position:absolute; top:20px; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:#000; border-radius:0 0 16px 16px; z-index:3;
    border:1px solid #1a1a1e; border-top:none; }
  .screen{ width:100%; height:100%; border-radius:34px; overflow:hidden; background:#08080a; position:relative; }
  iframe{ width:390px; height:778px; border:0; display:block; }
</style>
</head>
<body>
  <h1>BARREL 23</h1>
  <div class="sub">MOBILE — 390PX</div>
  <div class="rail">
    <div class="phone">
      <div class="phone__cap">01 · Hero + countdown</div>
      <div class="device"><div class="screen"><iframe src="index.html" data-sec="top"></iframe></div></div>
    </div>
    <div class="phone">
      <div class="phone__cap">02 · Next event</div>
      <div class="device"><div class="screen"><iframe src="index.html" data-sec="next"></iframe></div></div>
    </div>
    <div class="phone">
      <div class="phone__cap">03 · Archive</div>
      <div class="device"><div class="screen"><iframe src="index.html" data-sec="archive"></iframe></div></div>
    </div>
    <div class="phone">
      <div class="phone__cap">04 · Residents</div>
      <div class="device"><div class="screen"><iframe src="index.html" data-sec="djs"></iframe></div></div>
    </div>
    <div class="phone">
      <div class="phone__cap">05 · About + footer</div>
      <div class="device"><div class="screen"><iframe src="index.html" data-sec="info"></iframe></div></div>
    </div>
  </div>
<script>
  document.querySelectorAll('iframe').forEach(function(f){
    f.addEventListener('load', function(){
      var sec = f.dataset.sec;
      try{
        var win = f.contentWindow, doc = f.contentDocument;
        if(sec === 'top') return;
        setTimeout(function(){
          var t = doc.querySelector('#'+sec);
          if(t){ win.scrollTo(0, t.getBoundingClientRect().top + win.scrollY); }
        }, 700);
      }catch(e){}
    });
  });
</script>
</body>
</html>
