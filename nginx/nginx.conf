server {
    listen 80;
    server_name barrel23.com www.barrel23.com;

    client_max_body_size 210M;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # Uploads — served directly by nginx (bypass Python)
    location /uploads/ {
        alias /uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API — proxy to FastAPI
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Restrict admin endpoints to non-public (optional: uncomment to limit by IP)
        # location /api/auth/login { allow all; }
    }

    # Frontend static files
    location / {
        proxy_pass       http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Cache static assets aggressively
        location ~* \.(css|js|ico|woff2?)$ {
            proxy_pass http://api:8000;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
